name: Test NEXUS changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run NEXUS unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('src/dashboard.html').read_text(encoding='utf-8')
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          js=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/nexus-dashboard-check.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/nexus-dashboard-check.js
